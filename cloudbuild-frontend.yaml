steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'NEXT_PUBLIC_API_URL=${_BACKEND_URL}', '-t', 'gcr.io/$PROJECT_ID/eventgrapher-frontend', './frontend']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eventgrapher-frontend']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eventgrapher-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/eventgrapher-frontend'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/eventgrapher-frontend'

substitutions:
  _REGION: us-central1
  _BACKEND_URL: ''  # Set this when running: --substitutions=_BACKEND_URL=https://eventgrapher-backend-XXXXX-XX.a.run.app

